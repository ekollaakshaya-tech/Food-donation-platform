# Render Deploy Configuration
# This file configures automatic deployment on Render.com

services:
  - type: web
    name: nourishshare-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromGroup: frontend
